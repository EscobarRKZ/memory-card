permissions:
  contents: read

jobs:
  cloud-safety:
    name: Cloud sync regression tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check production JavaScript syntax
        run: |
          node --check backend-v2.js
          node --check app.js
          node --check profile-core.js
          node --check onboarding-v20.js
          node --check product-v14.js
          node --check settings-dashboard-v18.js
          node --check account-vault-v83.js
          node --check account-deletion-v84.js
          node --check account-deletion-page-v84.js
          node --check local-delete-cleanup-v85.js
          node --check supabase/functions/delete-own-account/logic.mjs
          node --check cloud-transfer-v80.js
          node --check cloud-conflicts-v81.js
          node --check friends-supabase-v2.js
          node --check auth-messages-v89.js
          node --check cover-rights-v90.js
          node --check backup-safety-v92.js
          node --check cloud-retry-v93.js
          node --check device-health-v96.js
          node --check cover-visibility-v97.js
          node --check scripts/check-hosted-release.mjs
          node --check scripts/generate-assetlinks.mjs
      - name: Run offline sync regression tests
        run: |
          node tests/test_cloud_transfer_v80.cjs
          node tests/test_cloud_conflicts_v81.cjs
          node tests/test_cloud_backend_v81.cjs
          node tests/test_server_rpc_v82.cjs
          node tests/test_account_vault_v83.cjs
          node tests/test_account_backend_v83.cjs
          node tests/test_account_deletion_v84.cjs
          node tests/test_delete_own_account_v85.mjs
          node tests/test_account_delete_client_v85.cjs
          node tests/test_local_delete_cleanup_v85.cjs
          node tests/test_sw_v66.cjs
          node tests/test_release_integrity_v86.cjs
          node tests/test_social_safety_v87.cjs
          node tests/test_user_reporting_v88.cjs
          node tests/test_auth_experience_v89.cjs
          node tests/test_cover_rights_v90.cjs
          node tests/test_hosted_release_v91.mjs
          node tests/test_assetlinks_v91.mjs
          node tests/test_backup_safety_v92.cjs
          node tests/test_cloud_retry_v93.cjs
          node tests/test_social_pair_guard_v94.cjs
          node tests/test_live_db_safety_v95.cjs
          node tests/test_device_health_v96.cjs
          node tests/test_cover_visibility_v97.cjs
          node tests/test_switch_rotation_v98.cjs
