name: Memory Card cloud safety

on:
  push:
    branches: [main]
    paths:
      - "backend-v2.js"
      - "app.js"
      - "account-vault-v83.js"
      - "tests/test_account_*.cjs"
      - "account-deletion-v84.js"
      - "account-deletion-page-v84.js"
      - "local-delete-cleanup-v85.js"
      - "supabase/functions/delete-own-account/**"
      - "tests/test_delete_own_account_v85.mjs"
      - "tests/test_local_delete_cleanup_v85.cjs"
      - "tests/test_account_delete_client_v85.cjs"
      - "delete-account.html"
      - "supabase/migrations/20261107131531_account_deletion_requests_v84.sql"
      - "cloud-conflicts-v81.js"
      - "cloud-transfer-v80.js"
      - "tests/test_cloud_*.cjs"
      - "tests/test_server_rpc_v82.cjs"
      - "supabase/migrations/20261107105332_add_version_checked_game_writes_v82.sql"
      - ".github/workflows/cloud-safety.yml"
  pull_request:
    paths:
      - "backend-v2.js"
      - "app.js"
      - "account-vault-v83.js"
      - "tests/test_account_*.cjs"
      - "account-deletion-v84.js"
      - "account-deletion-page-v84.js"
      - "local-delete-cleanup-v85.js"
      - "supabase/functions/delete-own-account/**"
      - "tests/test_delete_own_account_v85.mjs"
      - "tests/test_local_delete_cleanup_v85.cjs"
      - "tests/test_account_delete_client_v85.cjs"
      - "delete-account.html"
      - "supabase/migrations/20261107131531_account_deletion_requests_v84.sql"
      - "cloud-conflicts-v81.js"
      - "cloud-transfer-v80.js"
      - "tests/test_cloud_*.cjs"
      - "tests/test_server_rpc_v82.cjs"
      - "supabase/migrations/20261107105332_add_version_checked_game_writes_v82.sql"
      - ".github/workflows/cloud-safety.yml"

permissions:
  contents: read

jobs:
  cloud-safety:
    name: Cloud sync regression tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check production JavaScript syntax
        run: |
          node --check backend-v2.js
          node --check app.js
          node --check account-vault-v83.js
          node --check account-deletion-v84.js
          node --check account-deletion-page-v84.js
          node --check local-delete-cleanup-v85.js
          node --check supabase/functions/delete-own-account/logic.mjs
          node --check cloud-transfer-v80.js
          node --check cloud-conflicts-v81.js
      - name: Run offline sync regression tests
        run: |
          node tests/test_cloud_transfer_v80.cjs
          node tests/test_cloud_conflicts_v81.cjs
          node tests/test_cloud_backend_v81.cjs
          node tests/test_server_rpc_v82.cjs
          node tests/test_account_vault_v83.cjs
          node tests/test_account_backend_v83.cjs
          node tests/test_account_deletion_v84.cjs
          node tests/test_delete_own_account_v85.mjs
          node tests/test_account_delete_client_v85.cjs
          node tests/test_local_delete_cleanup_v85.cjs
