name: Source comment cleanup
on:
  push:
    paths:
      - '.cleanup-comments-trigger'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save acorn
      - shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const acorn=require('acorn');
          const skip=new Set(['node_modules','.git']);
          const files=[];
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(entry.name))continue;
              const p=path.join(dir,entry.name);
              if(entry.isDirectory())walk(p);
              else if(/\.js$/i.test(entry.name)||/\.css$/i.test(entry.name)||entry.name==='Code.gs')files.push(p);
            }
          }
          function stripJs(file,code){
            const comments=[];
            try{
              acorn.parse(code,{ecmaVersion:'latest',sourceType:'script',allowHashBang:true,onComment:comments});
            }catch(err){
              console.error(`Parse failed: ${file}: ${err.message}`);
              process.exitCode=1;
              return code;
            }
            let out=code;
            comments.sort((a,b)=>b.start-a.start);
            for(const c of comments)out=out.slice(0,c.start)+out.slice(c.end);
            return out;
          }
          function stripCss(code){return code.replace(/\/\*[\s\S]*?\*\//g,'');}
          walk('.');
          for(const file of files){
            const code=fs.readFileSync(file,'utf8');
            const out=/\.css$/i.test(file)?stripCss(code):stripJs(file,code);
            if(out!==code)fs.writeFileSync(file,out);
          }
          NODE
      - shell: bash
        run: |
          git config user.name "EscobarRKZ"
          git config user.email "fireman471live@gmail.com"
          git add -- '*.js' '*.css' 'Code.gs'
          if ! git diff --cached --quiet; then
            git commit -m "Strip source comments"
            git push
          fi
